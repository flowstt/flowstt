[package]
name = "flowstt-app"
version = "0.2.6"
description = "FlowSTT - Speech to Text GUI"
authors = ["you"]
edition = "2021"

[features]
default = []
cuda = ["vtx-engine/cuda"]

[lib]
name = "flowstt_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "macos-private-api",
    "tray-icon",
    "image-png",
    "protocol-asset",
] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
directories = "5"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "io-util",
    "net",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["clock"] }

# vtx-engine: audio capture, speech detection, transcription
# All shared types (AudioDevice, KeyCode, EngineEvent, etc.) are re-exported
# from vtx-engine::common — there is no separate vtx-common crate.
vtx-engine = "0.3.1"

# FlowSTT IPC protocol and app config types
flowstt-common = { path = "../src-common" }

tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1.22.0", features = ["v4"] }

# Desktop-only plugins
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
tokio = { version = "1", features = ["net"] }
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux-only: rdev for global keyboard hook via X11/evdev
[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5.3"

# macOS-only: CGEventTap for global keyboard hook (avoids rdev's TSM crash)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
