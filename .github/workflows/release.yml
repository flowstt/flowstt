name: Release

# macOS code signing and notarization via Apple Developer ID.
# Required repository secrets:
#
#   APPLE_CERTIFICATE          - Base64-encoded .p12 certificate file
#   APPLE_CERTIFICATE_PASSWORD - Password for the exported .p12 certificate
#   APPLE_SIGNING_IDENTITY     - Certificate name (e.g. "Developer ID Application: Name (TEAMID)")
#   APPLE_API_ISSUER           - App Store Connect API key issuer UUID
#   APPLE_API_KEY_CONTENT      - App Store Connect API key file content (.p8)
#   APPLE_API_KEY_ID           - App Store Connect API key ID

# Windows code signing via Azure Trusted Signing.
# Required repository secrets:
#
#   AZURE_TENANT_ID        - Microsoft Entra ID (Azure AD) directory/tenant ID
#   AZURE_CLIENT_ID        - App Registration application (client) ID
#   AZURE_CLIENT_SECRET    - App Registration client secret value
#   AZURE_SIGNING_ENDPOINT - Regional endpoint URL (e.g. https://eus.codesigning.azure.net)
#   AZURE_SIGNING_ACCOUNT  - Artifact Signing account name
#   AZURE_CERT_PROFILE     - Certificate profile name

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    strategy:
      fail-fast: true
      matrix:
        # TODO: Re-enable Linux support in a future version
        # platform: [ubuntu-22.04, macos-latest, windows-latest]
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Add PipeWire PPA for newer version (Ubuntu 22.04 ships 0.3.48, we need 0.3.65+)
          sudo add-apt-repository -y ppa:pipewire-debian/pipewire-upstream
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            cmake

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Rust lint - src-common
        run: cargo clippy --manifest-path src-common/Cargo.toml --all-targets -- -D warnings

      - name: Rust lint - src-cli
        run: cargo clippy --manifest-path src-cli/Cargo.toml --all-targets -- -D warnings

      # tauri-build validates macOS bundle resource paths at build-script time (even
      # during clippy). The macOS bundle includes target/release/flowstt and
      # target/release/libwhisper.dylib. Build both prerequisites first so they exist
      # when tauri-build executes. The engine step above runs its build script, which
      # downloads and copies libwhisper.dylib to target/release/ as a side effect.
      - name: Build CLI release (required for tauri-build resource validation on macOS)
        if: matrix.platform == 'macos-latest'
        run: cargo build -p flowstt-cli --release

      - name: Rust lint - src-tauri
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  build-and-release:
    needs: [test-and-lint]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg,app
          # TODO: Re-enable Linux support in a future version
          # - platform: ubuntu-22.04
          #   args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-common -> target
            src-cli -> target

      # macOS: build the CLI for the specific cross-compile target, then copy
      # to target/release/ where tauri.macos.conf.json expects to find it.
      # vtx-engine's build script runs as part of this build and downloads
      # libwhisper.dylib to target/release/ as a side effect.
      - name: Build CLI release for macOS bundling
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build -p flowstt-cli --release --target ${{ matrix.target }}
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/flowstt target/release/flowstt
          ls -la target/release/libwhisper.dylib

      # macOS: verify all required signing secrets are present, fail fast if not.
      - name: Verify Apple signing secrets
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          missing=()
          [ -z "$APPLE_CERTIFICATE" ]          && missing+=(APPLE_CERTIFICATE)
          [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && missing+=(APPLE_CERTIFICATE_PASSWORD)
          [ -z "$APPLE_SIGNING_IDENTITY" ]     && missing+=(APPLE_SIGNING_IDENTITY)
          [ -z "$APPLE_API_ISSUER" ]           && missing+=(APPLE_API_ISSUER)
          [ -z "$APPLE_API_KEY_CONTENT" ]      && missing+=(APPLE_API_KEY_CONTENT)
          [ -z "$APPLE_API_KEY_ID" ]           && missing+=(APPLE_API_KEY_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required Apple signing secrets: ${missing[*]}"
            exit 1
          fi

      # macOS: write the .p8 API key to a file; Tauri CLI reads APPLE_API_KEY
      # (key ID) and APPLE_API_KEY_PATH (file path) for notarization.
      - name: Write Apple API key file
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"

      # macOS: pre-sign bundled resources (CLI binary + libwhisper.dylib).
      # Tauri's bundler only signs frameworks and external binaries, NOT plain
      # resources. These files end up in Contents/Resources/ unsigned, which
      # causes notarization to fail. Sign them in target/release/ before
      # tauri-action copies them into the .app bundle.
      - name: Pre-sign macOS bundled resources
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain and import the certificate
          KEYCHAIN_PATH="$RUNNER_TEMP/presign.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and import the certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm "$CERT_PATH"

          # Add to keychain search list so codesign can find the identity
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"

          # Sign the CLI binary with Developer ID, secure timestamp, hardened runtime
          echo "Signing target/release/flowstt..."
          codesign --force --sign "$IDENTITY" \
            --timestamp \
            --options runtime \
            target/release/flowstt

          # Sign libwhisper.dylib
          echo "Signing target/release/libwhisper.dylib..."
          codesign --force --sign "$IDENTITY" \
            --timestamp \
            target/release/libwhisper.dylib

          # Verify signatures
          codesign --verify --verbose target/release/flowstt
          codesign --verify --verbose target/release/libwhisper.dylib

          # Make both read-only so the engine build script (which runs again
          # during pnpm tauri build) cannot overwrite them with unsigned copies.
          # The build script handles fs::copy failure gracefully (warning only).
          chmod 444 target/release/flowstt
          chmod 444 target/release/libwhisper.dylib

      - name: Build Tauri app (macOS)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # APPLE_API_KEY and APPLE_API_KEY_PATH set via $GITHUB_ENV above
          # Tauri Minisign keypair for updater artifact signing (orthogonal to Apple signing)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FlowSTT ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Windows: build the CLI first so Tauri can bundle it.
      - name: Build CLI release for Windows bundling
        if: matrix.platform == 'windows-latest'
        run: cargo build -p flowstt-cli --release

      # Windows: verify all required Azure signing secrets are present, fail fast if not.
      - name: Verify Azure signing secrets
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          missing=()
          [ -z "$AZURE_CLIENT_ID" ]        && missing+=(AZURE_CLIENT_ID)
          [ -z "$AZURE_CLIENT_SECRET" ]    && missing+=(AZURE_CLIENT_SECRET)
          [ -z "$AZURE_TENANT_ID" ]        && missing+=(AZURE_TENANT_ID)
          [ -z "$AZURE_SIGNING_ENDPOINT" ] && missing+=(AZURE_SIGNING_ENDPOINT)
          [ -z "$AZURE_SIGNING_ACCOUNT" ]  && missing+=(AZURE_SIGNING_ACCOUNT)
          [ -z "$AZURE_CERT_PROFILE" ]     && missing+=(AZURE_CERT_PROFILE)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required Azure signing secrets: ${missing[*]}"
            exit 1
          fi

      # Windows: download trusted-signing-cli and sign the CLI binary before
      # Tauri bundles it. Pin version deliberately -- update only when tested.
      - name: Install trusted-signing-cli
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "0.8.0"
          $url = "https://github.com/Levminer/trusted-signing-cli/releases/download/$version/trusted-signing-cli.exe"
          $dest = "$env:RUNNER_TEMP\trusted-signing-cli.exe"
          Invoke-WebRequest -Uri $url -OutFile $dest
          echo "$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sign CLI binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: >-
          trusted-signing-cli
          -e ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          -a ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          -c ${{ secrets.AZURE_CERT_PROFILE }}
          -d FlowSTT
          target/release/flowstt.exe

      # Windows: write Tauri signing overlay config with literal secret values
      # so Tauri's sign command subprocess does not need to expand env vars.
      - name: Write Tauri signing config
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          printf '%s\n' \
            '{' \
            '  "bundle": {' \
            '    "windows": {' \
            '      "signCommand": "trusted-signing-cli -e ${{ secrets.AZURE_SIGNING_ENDPOINT }} -a ${{ secrets.AZURE_SIGNING_ACCOUNT }} -c ${{ secrets.AZURE_CERT_PROFILE }} -d FlowSTT %1"' \
            '    }' \
            '  }' \
            '}' \
            > src-tauri/tauri.signing.conf.json

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # Tauri Minisign keypair for updater artifact signing (orthogonal to Azure signing)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FlowSTT ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.signing.conf.json

  generate-update-json:
    needs: [build-and-release]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate latest.json for Tauri updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Fetch the GitHub Release body for release notes
          NOTES=$(gh release view "${TAG}" --repo "${REPO}" --json body -q '.body // ""')

          # Download all .sig files from the release assets into /tmp/sigs.
          # tauri-action (createUpdaterArtifacts: true, --bundles dmg,app) produces:
          #   macOS aarch64: FlowSTT_aarch64.app.tar.gz      + .sig  (no version in name)
          #   macOS x86_64 : FlowSTT_x64.app.tar.gz          + .sig  (no version in name)
          #   Windows MSI  : FlowSTT_<ver>_x64_<locale>.msi  + .sig  (version + locale in name)
          mkdir -p /tmp/sigs
          gh release download "${TAG}" --repo "${REPO}" --pattern "*.sig" --dir /tmp/sigs

          echo "Downloaded .sig files:"
          ls -1 /tmp/sigs/

          # macOS: tauri-action omits the version from .app.tar.gz names
          SIG_AARCH64=$(cat "/tmp/sigs/FlowSTT_aarch64.app.tar.gz.sig" 2>/dev/null || echo "")
          SIG_X64=$(cat     "/tmp/sigs/FlowSTT_x64.app.tar.gz.sig"     2>/dev/null || echo "")

          # Windows MSI: discover locale-suffixed name dynamically, derive MSI filename
          WIN_SIG_FILE=$(ls /tmp/sigs/FlowSTT_${VERSION}_x64_*.msi.sig 2>/dev/null | head -1)
          if [ -n "${WIN_SIG_FILE}" ]; then
            SIG_WIN=$(cat "${WIN_SIG_FILE}")
            WIN_MSI_NAME=$(basename "${WIN_SIG_FILE}" .sig)
          else
            SIG_WIN=""
            WIN_MSI_NAME=""
          fi

          # Validate that all signatures are present
          if [ -z "${SIG_AARCH64}" ] || [ -z "${SIG_X64}" ] || [ -z "${SIG_WIN}" ]; then
            echo "ERROR: One or more .sig files are missing or empty."
            echo "  darwin-aarch64 (FlowSTT_aarch64.app.tar.gz.sig):   $([ -n "${SIG_AARCH64}" ] && echo "OK" || echo "MISSING")"
            echo "  darwin-x86_64  (FlowSTT_x64.app.tar.gz.sig):       $([ -n "${SIG_X64}" ]    && echo "OK" || echo "MISSING")"
            echo "  windows-x86_64 (FlowSTT_${VERSION}_x64_*.msi.sig): $([ -n "${SIG_WIN}" ]    && echo "OK" || echo "MISSING")"
            exit 1
          fi

          # Write latest.json using jq for correct JSON escaping.
          # macOS: url points to .app.tar.gz updater archive (version-less name)
          # Windows: url points to the .msi installer (tauri v2 uses MSI directly)
          jq -n \
            --arg version    "${VERSION}" \
            --arg notes      "${NOTES}" \
            --arg pub_date   "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url_aarch64 "${BASE_URL}/FlowSTT_aarch64.app.tar.gz" \
            --arg sig_aarch64 "${SIG_AARCH64}" \
            --arg url_x64    "${BASE_URL}/FlowSTT_x64.app.tar.gz" \
            --arg sig_x64    "${SIG_X64}" \
            --arg url_win    "${BASE_URL}/${WIN_MSI_NAME}" \
            --arg sig_win    "${SIG_WIN}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $url_aarch64, signature: $sig_aarch64 },
                "darwin-x86_64":  { url: $url_x64,    signature: $sig_x64 },
                "windows-x86_64": { url: $url_win,    signature: $sig_win }
              }
            }' > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Validate latest.json
        run: |
          # Verify the file is valid JSON
          jq empty latest.json || { echo "ERROR: latest.json is not valid JSON"; exit 1; }

          # Verify signature fields are non-empty
          for platform in "darwin-aarch64" "darwin-x86_64" "windows-x86_64"; do
            sig=$(jq -r ".platforms[\"${platform}\"].signature // empty" latest.json)
            if [ -z "${sig}" ]; then
              echo "ERROR: Signature for ${platform} is empty in latest.json"
              exit 1
            fi
            echo "  ${platform}: signature OK (${#sig} chars)"
          done
          echo "latest.json validation passed."

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" latest.json --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false

      - name: Trigger website redeploy
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEBSITE_DEPLOY_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flowstt/flowstt.io/dispatches \
            -d '{"event_type":"release-published","client_payload":{"tag":"${{ github.ref_name }}"}}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: ${HTTP_CODE}"
          if [ -n "$BODY" ]; then echo "Response: ${BODY}"; fi
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "ERROR: repository_dispatch failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
