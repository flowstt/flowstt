[workspace]
members = ["src-tauri", "src-common", "src-cli"]
resolver = "2"

# =============================================================================
# Local development override
#
# Uncomment the [patch.crates-io] section below to build FlowSTT against a
# local checkout of vtx-engine (expected at ../../vtx-engine relative to this
# Cargo.toml, i.e. a sibling of the flowstt/ directory).
#
# Usage:
#   1. Checkout vtx-engine at ~/ws/vtx-engine
#   2. Uncomment the [patch.crates-io] block below
#   3. Run `cargo build` — vtx-engine resolves from the local path
#   4. Re-comment before committing (CI always uses the crates.io version)
#
[patch.crates-io]
vtx-engine = { path = "../../vtx-engine/crates/vtx-engine" }
